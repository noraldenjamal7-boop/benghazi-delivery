name: Build Android APK
​on:
push:
branches: [ main ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Checkout repository
uses: actions/checkout@v4
​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'
​- name: Set up Android SDK
uses: android-actions/setup-android@v3
​- name: Set up Gradle
uses: gradle/actions/setup-gradle@v4
​- name: Create Android WebView project
run: |
mkdir -p app/src/main/java/com/example/benghazidelivery
mkdir -p app/src/main/res/layout
mkdir -p app/src/main/res/values
mkdir -p app/src/main/assets
​if [ -f index.html ]; then
cp index.html app/src/main/assets/index.html
else
cat << 'HTML_EOF' > app/src/main/assets/index.html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بنغازي للتوصيل</title>
<style>
body {
font-family: sans-serif;
background: #111827;
color: #f9fafb;
display: flex;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
text-align: center;
}
.card {
background: #1f2937;
padding: 2rem;
border-radius: 16px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
max-width: 360px;
}
h1 {
margin-top: 0;
color: #34d399;
}
</style>
</head>
<body>
<div class="card">
<h1>بنغازي للتوصيل</h1>
<p>تم بناء التطبيق بنجاح عبر GitHub Actions.</p>
</div>
</body>
</html>
HTML_EOF
fi
​cat << 'EOF' > settings.gradle
rootProject.name = "BenghaziDeliveryApp"
include ':app'
EOF
​cat << 'EOF' > gradle.properties
android.useAndroidX=true
android.enableJetifier=true
EOF
​cat << 'EOF' > build.gradle
buildscript {
repositories {
google()
mavenCentral()
}
dependencies {
classpath 'com.android.tools.build:gradle:8.2.2'
}
}
​allprojects {
repositories {
google()
mavenCentral()
}
}
EOF
​cat << 'EOF' > app/build.gradle
plugins {
id 'com.android.application'
}
​android {
namespace 'com.example.benghazidelivery'
compileSdk 34
​defaultConfig {
applicationId "com.example.benghazidelivery"
minSdk 21
targetSdk 34
versionCode 1
versionName "1.0"
}
​buildTypes {
release {
minifyEnabled false
proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
}
debug {
minifyEnabled false
}
}
}
​dependencies {
implementation 'androidx.appcompat:appcompat:1.6.1'
implementation 'com.google.android.material:material:1.11.0'
implementation 'androidx.webkit:webkit:1.10.0'
}
EOF
​cat << 'EOF' > app/proguard-rules.pro
-keep class com.example.benghazidelivery. { *; }
EOF
​cat << 'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
<uses-permission android:name="android.permission.INTERNET" />
​<application
android:allowBackup="true"
android:label="@string/app_name"
android:supportsRtl="true"
android:theme="@style/Theme.AppCompat.Light.NoActionBar">
<activity
android:name=".MainActivity"
android:exported="true">
<intent-filter>
<action android:name="android.intent.action.MAIN" />
<category android:name="android.intent.category.LAUNCHER" />
</intent-filter>
</activity>
</application>
</manifest>
EOF
​cat << 'EOF' > app/src/main/res/values/strings.xml
<?xml version="1.0" encoding="utf-8"?>
<resources>
<string name="app_name">Benghazi Delivery</string>
</resources>
EOF
​cat << 'EOF' > app/src/main/res/layout/activity_main.xml
<?xml version="1.0" encoding="utf-8"?>
<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
android:layout_width="match_parent"
android:layout_height="match_parent">
​<WebView
android:id="@+id/webview"
android:layout_width="match_parent"
android:layout_height="match_parent" />
</FrameLayout>
EOF
​cat << 'EOF' > app/src/main/java/com/example/benghazidelivery/MainActivity.java
package com.example.benghazidelivery;
​import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;
​public class MainActivity extends AppCompatActivity {
@Override
protected void onCreate(Bundle savedInstanceState) {
super.onCreate(savedInstanceState);
setContentView(R.layout.activity_main);
​WebView webView = findViewById(R.id.webview);
WebSettings webSettings = webView.getSettings();
webSettings.setJavaScriptEnabled(true);
webSettings.setDomStorageEnabled(true);
webView.setWebViewClient(new WebViewClient());
webView.loadUrl("file:///android_asset/index.html");
}
}
EOF
​- name: Build Debug APK
run: gradle assembleDebug --stacktrace
​- name: Upload APK artifact
uses: actions/upload-artifact@v4
with:
name: benghazi-delivery-apk
path: app/build/outputs/apk/debug/app-debug.apk
