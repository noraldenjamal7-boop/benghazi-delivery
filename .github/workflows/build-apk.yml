name: Build Android APK
​on:
push:
branches: [ main ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'
​- name: Set up Android SDK
uses: android-actions/setup-android@v3
​- name: Create Android WebView project
run: |
mkdir -p app/src/main/java/com/example/benghaziapp
mkdir -p app/src/main/res/layout
mkdir -p app/src/main/res/values
mkdir -p app/src/main/assets
​cp index.html app/src/main/assets/index.html
​cat << 'EOF' > settings.gradle
rootProject.name = "BenghaziDeliveryApp"
include ':app'
EOF
​cat << 'EOF' > build.gradle
buildscript {
repositories {
google()
mavenCentral()
}
dependencies {
classpath 'com.android.tools.build:gradle:8.2.2'
}
}
allprojects {
repositories {
google()
mavenCentral()
}
}
EOF
​cat << 'EOF' > app/build.gradle
plugins {
id 'com.android.application'
}
​android {
namespace "com.example.benghaziapp"
compileSdk 34
​defaultConfig {
applicationId "com.example.benghaziapp"
minSdk 21
targetSdk 34
versionCode 1
versionName "1.0"
}
​buildTypes {
release {
minifyEnabled false
}
}
}
​dependencies {
implementation 'androidx.appcompat:appcompat:1.6.1'
}
EOF
​cat << 'EOF' > app/src/main/res/values/strings.xml
<resources>
<string name="app_name">تطبيق التوصيل - بنغازي</string>
</resources>
EOF
​cat << 'EOF' > app/src/main/res/layout/activity_main.xml
<?xml version="1.0" encoding="utf-8"?>
<WebView xmlns:android="http://schemas.android.com/apk/res/android"
android:id="@+id/webview"
android:layout_width="match_parent"
android:layout_height="match_parent" />
EOF
​cat << 'EOF' > app/src/main/java/com/example/benghaziapp/MainActivity.java
package com.example.benghaziapp;
​import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;
​public class MainActivity extends AppCompatActivity {
@Override
protected void onCreate(Bundle savedInstanceState) {
super.onCreate(savedInstanceState);
setContentView(R.layout.activity_main);
​WebView webView = findViewById(R.id.webview);
WebSettings settings = webView.getSettings();
settings.setJavaScriptEnabled(true);
settings.setDomStorageEnabled(true);
settings.setAllowFileAccess(true);
webView.setWebViewClient(new WebViewClient());
webView.loadUrl("file:///android_asset/index.html");
}
}
EOF
​cat << 'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
<uses-permission android:name="android.permission.INTERNET" />
<application
android:label="@string/app_name"
android:usesCleartextTraffic="true">
<activity
android:name=".MainActivity"
android:exported="true">
<intent-filter>
<action android:name="android.intent.action.MAIN" />
<category android:name="android.intent.category.LAUNCHER" />
</intent-filter>
</activity>
</application>
</manifest>
EOF
​gradle wrapper --gradle-version 8.4 --distribution-type bin
​- name: Build APK
run: ./gradlew assembleDebug
​- name: Upload APK artifact
uses: actions/upload-artifact@v4
with:
name: benghazi-app-apk
path: app/build/outputs/apk/debug/app-debug.apk
